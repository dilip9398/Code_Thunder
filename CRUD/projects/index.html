<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #080202;
    color: #eeff00;
    font-family: Arial, sans-serif;
}

#root {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 40px;
    max-width: auto;
    margin: 0 auto;
    border: 2px solid white;
    border-radius : 5px;
    overflow : hidden;
}
img{
    width : 300px;
    height : 250px;
    overflow : hidden;
}

.card {
    background-color: #111;
    border: 6px solid #eeff00;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    transition: transform 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card-image {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.card h2 {
    font-size: 18px;
    margin: 12px 0 6px;
}

.card p {
    margin: 4px 0;
    font-size: 14px;
}
        
    </style>
</head>
<body>
    
    <h1 style="text-align:center"> Hello Friends</h1>
    

    <div id = 'root'>

    </div>

    <script src='script.js'></script>

    
</body>
</html>
