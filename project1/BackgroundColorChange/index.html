<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body
    style="background-color: black; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: white;">

    <div id='box'
        style="display:flex; align-items:center;justify-content:center; flex-direction:row; height:auto; border:2px solid red">


        <button id="red"
            style="background-color:red; color:white; font-size:20px; padding:20px; margin:2px;height:60px">RED</button>
        <button id="yellow"
            style="background-color:yellow; color:black; font-size:20px; padding:20px; margin:2px;height:60px">YELLOW</button>
        <button id="blue"
            style="background-color:rgb(0, 0, 239); color:white; font-size:20px; padding:20px; margin:2px;height: 60px">BLUE</button>
        <button id="orange"
            style="background-color:orange; color:white; font-size:20px; padding:20px; margin:2px;height:60px">ORAANGE</button>
        <button id="green"
            style="background-color:green; color:white; font-size:20px; padding:20px; margin:2px;height:60px">GREEN</button>
    </div>
    <script src="script.js"></script>

</body>

</html>
